name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  BUILD_NUMBER: ${{ github.run_number }}
  GIT_SHA: ${{ github.sha }}
  FORCE_COLOR: "1"

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: scripts/version.sh check

  server:
    name: Server (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boughtsafe
          POSTGRES_PASSWORD: boughtsafe
          POSTGRES_DB: boughtsafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boughtsafe" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DB_URL: postgresql+psycopg://boughtsafe:boughtsafe@localhost:5432/boughtsafe
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Migrations apply cleanly and match the models
        env:
          BOUGHTSAFE_DATABASE_URL: ${{ env.DB_URL }}
        run: |
          boughtsafe migrate
          alembic -c alembic.ini check
          alembic -c alembic.ini downgrade base
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres, with coverage)
        env:
          BOUGHTSAFE_TEST_DATABASE_URL: ${{ env.DB_URL }}
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - name: Build wheel and sdist
        if: matrix.python == '3.13'
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.13'
        with:
          name: server-dist
          path: |
            server/dist/
            server/coverage.xml
          retention-days: 14

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build/
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install server
        run: python -m pip install ./server
      - name: Install web
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: web
        env:
          CI: "1"
          BOUGHTSAFE_BIN: boughtsafe
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [version]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/boughtsafe-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.name.outputs.repo }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=build-${{ github.run_number }}
      - name: Build${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && ' and push edge' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image == 'api' && 'server' || 'web' }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=edge
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
